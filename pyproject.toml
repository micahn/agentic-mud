[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mud"
version = "0.1.0"
description = "Club MUD server"
requires-python = ">=3.11"
dependencies = [
    "websockets",
    "pydantic>=2",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
